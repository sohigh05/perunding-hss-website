# Jalankan semakan terlebih dahulu, kemudian terbitkan hanya kandungan dist.
name: Semak dan Terbit Website HSS

# Penerbitan bermula selepas kod dikemas kini pada main atau dijalankan secara manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Akses lalai hanya membenarkan pembacaan kod repositori.
permissions:
  contents: read

# Pastikan hanya satu penerbitan Pages berjalan pada satu masa.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Semak fail dan kandungan sebelum menghasilkan pakej website.
  semak:
    runs-on: ubuntu-latest
    steps:
      - name: Dapatkan kod terkini
        uses: actions/checkout@v7
      - name: Sediakan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Semak struktur dan fungsi asas
        run: node semak.mjs
      - name: Semak padanan maklumat profil
        run: node semak-profil.mjs
      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v6
      - name: Sediakan fail penerbitan
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Kebenaran penerbitan hanya diberikan kepada tugas yang memerlukannya.
  terbit:
    needs: semak
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan website
        id: deployment
        uses: actions/deploy-pages@v5
